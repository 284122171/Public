function switchLang(lang) {
  const t = i18n[lang] || i18n.en;
  document.getElementById('t_subtitle').textContent = t.subtitle;
  document.getElementById('t_about').innerHTML = t.about;
  document.getElementById('t_about_desc').textContent = t.about_desc;
  document.getElementById('t_f1').textContent = t.f1;
  document.getElementById('t_f2').textContent = t.f2;
  document.getElementById('t_f3').textContent = t.f3;
  document.getElementById('t_f4').textContent = t.f4;
  document.getElementById('t_f5').textContent = t.f5;
  document.getElementById('t_f6').textContent = t.f6;
  document.getElementById('t_support').innerHTML = t.support;
  document.getElementById('t_support_desc').textContent = t.support_desc;
  document.getElementById('t_email_label').textContent = t.email_label;
  document.getElementById('t_support_note').textContent = t.support_note;
  document.getElementById('t_faq').innerHTML = t.faq;
  document.getElementById('t_faq1').innerHTML = t.faq1;
  document.getElementById('t_faq2').innerHTML = t.faq2;
  document.getElementById('t_faq3').innerHTML = t.faq3;
  document.getElementById('t_faq4').innerHTML = t.faq4;
  document.getElementById('t_faq5').innerHTML = t.faq5;
  document.getElementById('t_privacy').innerHTML = t.privacy;
  document.getElementById('t_privacy_desc').textContent = t.privacy_desc;
  const pl = document.getElementById('t_privacy_list');
  pl.innerHTML = t.privacy_items.map(i => '<li>' + i + '</li>').join('');
  document.getElementById('t_privacy_link').textContent = t.privacy_link;
  document.documentElement.lang = lang;
  document.documentElement.dir = lang === 'ar' ? 'rtl' : 'ltr';
  localStorage.setItem('lang', lang);
}

// Auto-detect language
(function() {
  const saved = localStorage.getItem('lang');
  if (saved && i18n[saved]) { document.getElementById('langSelect').value = saved; switchLang(saved); return; }
  const bl = (navigator.language || '').toLowerCase();
  const code = bl.startsWith('zh') ? 'zh' : bl.startsWith('ko') ? 'ko' : bl.startsWith('ja') ? 'ja' : bl.startsWith('es') ? 'es' : bl.startsWith('pt') ? 'pt' : bl.startsWith('fr') ? 'fr' : bl.startsWith('de') ? 'de' : bl.startsWith('ru') ? 'ru' : bl.startsWith('it') ? 'it' : bl.startsWith('vi') ? 'vi' : bl.startsWith('ar') ? 'ar' : 'en';
  document.getElementById('langSelect').value = code;
  switchLang(code);
})();
</script>
